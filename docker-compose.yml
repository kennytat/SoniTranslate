services:
  soni:
    # env_file:
    #   - .env
    build:
      context: .
      dockerfile: Dockerfile
      cache_from:
        - type=bind,source=${HOME}/.cache/pip,target=/root/.cache/pip
    image: ghcr.io/mdds-labs/sonitranslate:stable
    container_name: soni
    command: [ "python", "app.py" ]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    # shm_size: 1024m
    ports:
      - 6860:6860
      - 7902:7901
      - 3100:3100
    environment:
      YOUR_HF_TOKEN: ""
      TTS_JOBS: 5
      # MODEL_SHAREID: "TJmDDgtSj4HxDyW"
      # MODEL_PASSWORD: ""
      # ENABLE_AUTH: "true"
      # UPSAMPLING_ENABLE: "true"
      # COPY_OUTPUT_DIR: "/mnt/hdd6tb/man-smb"
      #   AUTH_USER: 'test'
      #   AUTH_PASS: 'test'
    restart: unless-stopped
    volumes:
      - /mnt/backup/AI/sonitranslate/cache:/root/.cache
      - /mnt/backup/AI/sonitranslate/model:/app/model
      - ./db:/app/db
      # - /mnt/hdd6tb/man-smb:/mnt/hdd6tb/man-smb
      # - /mnt/hdd6tb/tmp:/tmp
